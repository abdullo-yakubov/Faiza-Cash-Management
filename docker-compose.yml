# Запуск всей системы: docker compose up --build
# Перед первым запуском скопируйте .env.example в .env и задайте свои пароли.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: faiza_gold
      POSTGRES_USER: faiza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U faiza -d faiza_gold']
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      ConnectionStrings__Default: Host=db;Database=faiza_gold;Username=faiza;Password=${POSTGRES_PASSWORD}
      Seed__AdminLogin: ${ADMIN_LOGIN:-admin}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?Задайте ADMIN_PASSWORD в .env}
      Seed__Demo: ${DEMO_DATA:-false}
      Seed__DemoPassword: ${DEMO_PASSWORD:-Demo12345}
    volumes:
      - api-keys:/keys
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - '127.0.0.1:8085:80'
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
  api-keys:
