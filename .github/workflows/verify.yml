name: Verify FAIZA GOLD
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dotnet restore backend/FaizaCash.sln --locked-mode
      - run: dotnet build backend/FaizaCash.sln --no-restore
      - run: dotnet test backend/FaizaCash.sln --no-build
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend audit --audit-level=high
